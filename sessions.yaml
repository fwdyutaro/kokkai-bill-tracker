# 国会の会期メタデータ
#
# 参議院の議案情報だけでは「審議中」と「閉会により審査未了」を区別できないため、
# 会期の開閉情報を外部データとしてここで管理する。
#
# 新しい会期が召集されたら、このファイルに1エントリ追記するだけで、
# 最新回次が自動選択される。
# 会期が閉会したら、該当エントリの to に閉会日を入れる（会期中は null）。
#
# フィールド:
#   diet    … 回次（整数）
#   name    … 会期の種別（常会／臨時会／特別会）
#   from    … 召集日 (YYYY-MM-DD)
#   to      … 閉会日 (YYYY-MM-DD)。会期中は null
#   planned_to … 会期末の予定日 (YYYY-MM-DD・任意)。この日を過ぎても to が null のままだと
#               CI が警告を出す（閉会日の入れ忘れ防止）。会期が延長されたら更新する
#   clb_id  … 内閣法制局「国会提出法律案」一覧ページのID（省庁名・提出理由の補完に使用）

sessions:
  - diet: 221
    name: 特別会
    from: "2026-02-18"
    to: "2026-07-25"
    clb_id: "5144"
  - diet: 222
    name: 臨時会
    from: "2026-10-05"
    to: null              # 閉会したら閉会日を入れる
    planned_to: "2026-12-12"   # 会期末予定（69日間）
    clb_id: "5339"
