name: submit-reference
# 参考情報の提供Issueを処理する。
#  - 投稿/編集時: 書誌メタと関連度を自動推定し、結果をコメント＋ needs-review ラベル付与
#  - approved ラベル付与時: submissions.json に取り込み、サイトデータへ反映してIssueをクローズ
on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: bill-tracker-data-update
  cancel-in-progress: false

jobs:
  ingest:
    if: (contains(join(github.event.issue.labels.*.name), 'submission') || startsWith(github.event.issue.title, '[情報提供]')) && github.event.action != 'labeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-core.txt
      - name: 自動処理（書誌＋関連度）
        env:
          T: ${{ github.event.issue.title }}
          B: ${{ github.event.issue.body }}
        run: |
          set +e
          python ingest_submission.py --issue-title "$T" --issue-body "$B" --out rec.json > comment.md 2>&1
          result=$?
          set -e
          if [ "$result" -gt 2 ]; then
            echo "予期しない自動処理エラー（終了コード: $result）" >&2
            exit "$result"
          fi
          if [ ! -s comment.md ]; then
            echo "自動処理できませんでした。手動確認が必要です。" > comment.md
          fi
          echo "自動処理の終了コード: $result"
      - name: コメント＋ラベル
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          gh label create submission -R "$GITHUB_REPOSITORY" --color "1D76DB" --description "参考情報の提供" --force
          gh label create needs-review -R "$GITHUB_REPOSITORY" --color "FBCA04" --description "メンテナによる確認が必要" --force
          gh issue comment "$NUM" -F comment.md
          gh issue edit "$NUM" --add-label submission --add-label needs-review

  publish:
    if: github.event.action == 'labeled' && github.event.label.name == 'approved' && (contains(join(github.event.issue.labels.*.name), 'submission') || startsWith(github.event.issue.title, '[情報提供]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-core.txt
      - name: レコード生成→submissions.jsonへ追加
        id: prepare
        env:
          T: ${{ github.event.issue.title }}
          B: ${{ github.event.issue.body }}
        run: |
          set +e
          python ingest_submission.py --issue-title "$T" --issue-body "$B" --out rec.json > ingest-comment.md 2>&1
          ingest_result=$?
          set -e
          if [ "$ingest_result" -gt 2 ]; then
            echo "result=failed" >> "$GITHUB_OUTPUT"
            exit "$ingest_result"
          fi
          if [ "$ingest_result" -ne 0 ] || [ ! -f rec.json ]; then
            echo "result=manual_review" >> "$GITHUB_OUTPUT"
            echo "detail=自動処理に失敗したため、手動確認が必要です" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! python issue_workflow.py approve-submission --bills bills.json; then
            echo "result=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          python merge_submissions.py
      - name: 手動確認へ戻す
        if: steps.prepare.outputs.result == 'manual_review'
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$NUM" -R "$GITHUB_REPOSITORY" --remove-label approved --add-label needs-review
          gh issue comment "$NUM" -R "$GITHUB_REPOSITORY" -b "${{ steps.prepare.outputs.detail }}。Issueは閉じず、掲載も行っていません。"
      - name: コミット＆push
        if: steps.prepare.outputs.result == 'published-ready'
        env:
          NUM: ${{ github.event.issue.number }}
        run: |
          git config user.name "bill-tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          git add submissions.json data_collected.js bills.json
          git diff --cached --quiet || git commit -m "feat: 提供情報を掲載 (#$NUM)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
      - name: Issueをクローズ
        if: steps.prepare.outputs.result == 'published-ready'
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          DETAIL: ${{ steps.prepare.outputs.detail }}
        run: |
          # 差分なしの重複投稿は「既掲載」として閉じ、新規掲載とは表示しない（FR-3）。
          if [ "$DETAIL" = "already-listed" ]; then
            gh issue close "$NUM" -R "$GITHUB_REPOSITORY" -c "この参考情報は既に掲載済みのため、重複としてクローズします。ご確認ありがとうございます。"
          else
            gh issue close "$NUM" -R "$GITHUB_REPOSITORY" -c "掲載しました。ご提供ありがとうございます。"
          fi
